name: Update GitHub Profile Trophy

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/update-github-trophy.yml

permissions:
  contents: write

jobs:
  generate-trophy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate GitHub Profile Trophy
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: AbolfazlMohammady
          output_path: assets/github-trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: gruvbox

      - name: Commit updated trophy
        run: |
          git add assets/github-trophy.svg
          if git diff --cached --quiet; then
            echo "Trophy SVG has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update GitHub profile trophies"
          git push
